services:
  - type: web
    name: contacthub
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: SeedDemoData
        value: "true"
      - key: ClientUrl
        value: https://contacthub-web.onrender.com

  - type: web
    name: contacthub-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist/frontend/browser
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://contacthub-h4or.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
