# Render Blueprint: the Docker image as one free web service.
# Render routes a single port, so PORT is 4700, where nginx serves the Angular app and forwards
# /api and /swagger to the API on 8080 inside the container. Swagger's Client button opens "/",
# the same origin.
services:
  - type: web
    name: contacthub
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # CI deploys after the tests pass (the deploy job in .github/workflows/ci.yml).
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "4700"
      - key: SeedDemoData
        value: "true"
      - key: ClientUrl
        value: /
