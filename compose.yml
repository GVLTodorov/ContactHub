services:
  # One container: the API on 8080 and nginx on 4700 serving the Angular build (see Dockerfile).
  app:
    build: .
    environment:
      ConnectionStrings__Default: Data Source=database/contacthub.db
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:8080"
      - "${FRONTEND_PORT:-4700}:4700"
    volumes:
      - dbdata:/app/database

volumes:
  dbdata:
